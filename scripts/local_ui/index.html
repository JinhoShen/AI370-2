<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI370-2 · Local Agent</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="badge">LOCAL ONLY · 離線可用</span><h1>AI370-2 工作台</h1><p>本地模型、Ross 與工程工具，一個入口。</p></div><span id="connection">連線中…</span></header>
<main><aside><h2>模型</h2><label for="model">本機已登錄模型</label><select id="model"></select><p id="model-detail"></p><button id="load">載入選定模型</button><p class="muted">一次只載入一個大型模型。不下載、不更改正式 recipe。切換可能需要數十秒。</p><div id="runtime"></div><h2>工作模式</h2><label for="mode">執行範圍</label><select id="mode"><option value="read">對話／專案唯讀查詢</option><option value="xsim">隔離 RTL 修復＋XSim</option><option value="vivado">隔離 RTL 修復＋XSim＋Vivado 綜合</option></select><label class="check"><input type="checkbox" id="ross" checked> 使用 AMD Ross Skills／Local KB</label><p id="mode-detail">可查閱專案安全文字檔；禁止修改與執行命令。</p><p class="muted">GPT-OSS、Devstral：本機未找到。Qwen3.6：已退休。選單不將它們當作可用模型。</p></aside>
<section><div class="section-head"><h2>交代工作</h2><button id="stop" class="danger">停止目前工作</button></div><label for="task">需求或問題</label><textarea id="task" rows="5" maxlength="12000" placeholder="例如：請說明目前 Local Agent 的離線能力與未完成項目。"></textarea><div class="actions"><span id="notice" role="status"></span><button id="send">送出工作</button></div><h2>進度與結果</h2><p class="muted">每項工作保留獨立紀錄；工具名稱會隨執行更新，完成後顯示結果與 evidence 路徑。純對話完成不代表工程驗證 PASS。</p><div id="jobs"></div></section></main><script src="/app.js"></script></body></html>
